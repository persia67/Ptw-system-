name: Build & Package PTW System (Tauri v2, Windows & Android)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri-windows:
    name: 🦀 Build Tauri v2 Windows Installer (.msi & .exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (22.x LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Build Tauri v2 Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'PTW System v__VERSION__'
          releaseBody: 'Automated Tauri v2 Windows Release'
          releaseDraft: false
          prerelease: false
          tauriScript: 'npx tauri'
          args: '--ignore-version-mismatches'

      - name: Prepare Tauri Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist-tauri
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe", "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue | Copy-Item -Destination dist-tauri/ -Force

      - name: Upload Tauri Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-installer
          path: |
            dist-tauri/*
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

  build-electron-windows:
    name: 💻 Build Electron Windows Installer (.exe & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (22.x LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Build Electron Windows Installer (.exe) & Portable Executable
        run: npx electron-builder --win nsis portable --config.directories.output=dist-win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Electron Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-installer
          path: |
            dist-win/*.exe
            dist-win/*.msi
          retention-days: 30

  build-android:
    name: 📱 Build Android App (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (22.x LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Get Version from package.json
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Add and Sync Capacitor Android
        run: |
          rm -rf android
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Output
        run: |
          mkdir -p dist-android
          VERSION="${{ steps.package-version.outputs.version }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-android/PTW-System-v${VERSION}-Android.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            dist-android/*.apk
          retention-days: 30

  publish-release:
    name: 🚀 Publish GitHub Release (Tauri v2, Windows & Android)
    needs: [build-tauri-windows, build-electron-windows, build-android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Get Version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Tauri Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-windows-installer
          path: release-assets
        continue-on-error: true

      - name: Download Electron Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: electron-windows-installer
          path: release-assets
        continue-on-error: true

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: PTW System Release v${{ steps.get_version.outputs.version }} (Tauri v2, Windows & Android)
          body: |
            ## 🚀 انتشار نسخه v${{ steps.get_version.outputs.version }} سامانه مدیریت مجوز کار PTW و LOTO

            ### 📱 نسخه اندروید (Android APK)
            - **PTW-System-v${{ steps.get_version.outputs.version }}-Android.apk**: برنامه نصبی قابل اجرا روی کلیه گوشی‌ها و تبلت‌های اندروید.

            ### 💻 نسخه دسکتاپ ویندوز (Tauri v2 & Electron)
            - **نسخه خ Were / Tauri v2 (.exe / .msi)**: برنامه نصبی فوق‌العاده سبک، پرسرعت و بهینه‌شده با فریم‌ورک قدرتمند Tauri v2.
            - **نسخه Electron (.exe)**: نسخه نصبی و پرتابل متداول دسکتاپ.

            ### 🛠️ بهبودها و ویژگی‌های کلی
            - ⚡ اجرا کاملاً خودکار، آفلاین و بدون نیاز به اینترنت.
            - 🐛 رفع کامل مشکلات رندر و صفحه سفید در تمام نسخه‌ها.
            - 🔐 احراز هویت با کد PIN، امضای دیجیتال و پلمپ امنیتی SHA-256.
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
