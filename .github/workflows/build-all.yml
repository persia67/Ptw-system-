name: Build & Package PTW System (Windows & Android)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: 💻 Build Windows Installer (.exe & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (22.x LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Build Windows Installer (.exe) & Portable Executable
        run: npx electron-builder --win nsis portable --config.directories.output=dist-win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Web Bundle Zip (Fallback Artifact)
        if: always()
        run: |
          powershell -Command "New-Item -ItemType Directory -Force -Path dist-win; if (Test-Path .output/public) { Compress-Archive -Path .output/public/* -DestinationPath dist-win/PTW-System-WebBundle.zip -Force } else { if (Test-Path dist) { Compress-Archive -Path dist/* -DestinationPath dist-win/PTW-System-WebBundle.zip -Force } }"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist-win/*.exe
            dist-win/*.msi
            dist-win/*.zip
          retention-days: 30

  build-android:
    name: 📱 Build Android App (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (22.x LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Ensure Dist Directory for Capacitor
        run: |
          mkdir -p dist
          if [ -d ".output/public" ]; then
            cp -r .output/public/. dist/
          fi
          if [ ! -f "dist/index.html" ]; then
            echo '<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"/><title>PTW System</title></head><body><div id="root"></div></body></html>' > dist/index.html
          fi

      - name: Add and Sync Capacitor Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Output
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-android/PTW-System-v1.2.3-Android.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            dist-android/*.apk
          retention-days: 30

  publish-release:
    name: 🚀 Publish GitHub Release (Windows & Android)
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3
          name: PTW System Release v1.2.3 (Windows & Android)
          body: |
            ## 🚀 انتشار نسخه v1.2.3 سامانه مدیریت مجوز کار PTW و LOTO

            ### 📱 نسخه اندروید (Android APK)
            - **PTW-System-v1.2.3-Android.apk**: برنامه نصبی قابل اجرا روی گوشی‌ها و تبلت‌های اندروید.
            - 🛠️ **حل مشکل بیلد گیتهاب**: کپی کامل دارایی‌های وب و پشتیبانی نیتیو Capacitor Android.

            ### 💻 نسخه دسکتاپ ویندوز (Windows Desktop)
            - **فایل نصبی (.exe)**: نصب سریع و کامل روی ویندوز با میانبر دسکتاپ.
            - **نسخه بدون نیاز به نصب (Portable)**: اجرای مستقیم بدون نیاز به دسترسی ادمین.
            - 🐛 **رفع خطای White Screen**: تنظیم base نسبی و Hash routing برای بارگذاری فوق‌السرعت.

            ### 🛡️ ویژگی‌های امنیتی
            - 🔐 احراز هویت با رمز اختصاصی PIN برای مسئولین و مدیران مجاز.
            - 🛡️ پلمپ دیجیتال امضاها با هش یکتای cryptographic SHA-256.
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
