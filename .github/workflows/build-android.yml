name: Build Android APK (PTW System)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Package Android App (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (22.x LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Add and Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK Output
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-android/PTW-System-v1.2.1.apk

      - name: Create GitHub Release & Upload Android APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.2.1
          name: PTW System Release v1.2.1 (Windows & Android)
          body: |
            ## 🚀 انتشار نسخه v1.2.1 سامانه مدیریت مجوز کار PTW و LOTO
            - 🐛 حل مشکل صفحه سفید (White Screen) نسخه ویندوز با تنظیم base نسبی و مسیریابی hash در الکترون
            - 📱 پشتیبانی و کامپایل نسخه اندروید (.apk)
            - 💻 بسته نصبی دسکتاپ Windows (.exe و Portable)
            - 🔐 احراز هویت با رمز اختصاصی PIN برای مسئولین و مدیران مجاز
            - 🛡️ هش رمزی یکتا SHA-256 و پلمپ دیجیتال امضاها
          files: |
            dist-android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PTW-System-Android-APK
          path: |
            dist-android/*.apk
          retention-days: 30
