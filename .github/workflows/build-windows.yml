name: Build Windows Installer (PTW System)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows App (.exe Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (22.x LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Build Windows Installer (.exe) & Portable Executable
        run: npx electron-builder --win nsis portable --config.directories.output=dist-win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Web Bundle Zip (Fallback Artifact)
        if: always()
        run: |
          powershell -Command "New-Item -ItemType Directory -Force -Path dist-win; if (Test-Path .output/public) { Compress-Archive -Path .output/public/* -DestinationPath dist-win/PTW-System-WebBundle.zip -Force } else { if (Test-Path dist) { Compress-Archive -Path dist/* -DestinationPath dist-win/PTW-System-WebBundle.zip -Force } }"

      - name: Create GitHub Release & Upload Files
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.1.0
          name: PTW System Release v1.1.0
          body: |
            ## 🚀 انتشار نسخه v1.1.0 سامانه مدیریت مجوز کار PTW و LOTO
            - 🔐 افزودن احراز هویت با رمز اختصاصی PIN برای مسئولین و مدیران مجاز
            - 🛡️ هش رمزی یکتا SHA-256 و پلمپ دیجیتال امضاها
            - 💻 بسته نصبی دسکتاپ Windows (.exe و Portable)
          files: |
            dist-win/*.exe
            dist-win/*.msi
            dist-win/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts for Download
        uses: actions/upload-artifact@v4
        with:
          name: PTW-System-Windows-Installer
          path: |
            dist-win/*.exe
            dist-win/*.msi
            dist-win/*.zip
          retention-days: 30
