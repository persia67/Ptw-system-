[package]
name = "ptw-system"
version = "1.2.6"
description = "سامانه مدیریت مجوز کار PTW و LOTO واحد ایمنی و بهداشت حرفه‌ای"
authors = ["HSE Department"]
edition = "2021"

[lib]
name = "ptw_system_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
